<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    >
    <title>nearComponents app smoke</title>
    <style>
      :root {
        color-scheme: light;
        --pico-font-family: ui-sans-serif, system-ui, sans-serif;
        --pico-font-size: 16px;
        --pico-line-height: 1.5;
        --pico-background-color: #f5f7fb;
        --pico-card-background-color: #ffffff;
        --pico-color: #1d2733;
        --pico-muted-color: #637282;
        --pico-primary: #005a8d;
        --pico-primary-hover: #00496f;
        --pico-primary-background: #005a8d;
        --pico-primary-inverse: #ffffff;
        --pico-primary-soft-background: rgba(0, 90, 141, 0.12);
        --pico-border-color: rgba(29, 39, 51, 0.14);
        --pico-form-element-border-color: rgba(29, 39, 51, 0.18);
        --pico-border-radius: 0.75rem;
        --pico-card-box-shadow: 0 1.25rem 3rem -1.75rem rgba(0, 34, 68, 0.35);
        --pico-spacing: 1rem;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--pico-background-color);
        color: var(--pico-color);
        font-family: var(--pico-font-family);
      }
    </style>
    <script type="module" src="../app-main.js"></script>
  </head>
  <body unresolved>
    <near-app-smoke></near-app-smoke>
  </body>
</html>
